<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
let mediaRecorder = null;
let audioChunks = [];
let speechRec = null;
let silenceTimer = null;
let finalTranscript = "";

function startSymptomVoiceRecording(btn) {
    if (mediaRecorder && mediaRecorder.state === "recording") {
        stopSymptomVoiceRecording();
        return;
    }
    
    let lang = document.getElementById("langApp").value || "en";
    let speechLang = "en-IN";
    if (lang === "hi") speechLang = "hi-IN";
    if (lang === "mr") speechLang = "mr-IN";

    navigator.mediaDevices.getUserMedia({ audio: true }).then(stream => {
        mediaRecorder = new MediaRecorder(stream);
        audioChunks = [];
        mediaRecorder.ondataavailable = e => { if (e.data.size > 0) audioChunks.push(e.data); };
        mediaRecorder.onstop = () => {
            let blob = new Blob(audioChunks, { type: "audio/webm" });
            let reader = new FileReader();
            reader.readAsDataURL(blob);
            reader.onloadend = () => {
                window._lastAudioBase64 = reader.result;
                document.getElementById("voiceStatus").innerText = "Audio recorded! Matching symptoms...";
                matchSymptomsFromTranscript(finalTranscript);
            }
        };

        let vStatus = document.getElementById("voiceStatus");
        let vText = document.getElementById("voiceTranscript");
        if (vStatus) { vStatus.style.display = "block"; vStatus.innerText = "Listening... Speak your symptoms."; }
        if (vText) { vText.style.display = "block"; vText.innerText = ""; }
        finalTranscript = "";
        
        btn.innerHTML = '<svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align: middle; margin-top:-2px;"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect></svg>'; // red stop or something
        btn.style.background = "var(--red)";

        let SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (SpeechRecognition) {
            speechRec = new SpeechRecognition();
            speechRec.continuous = true;
            speechRec.interimResults = true;
            speechRec.lang = speechLang;

            speechRec.onresult = function(event) {
                clearTimeout(silenceTimer);
                
                let interim = "";
                finalTranscript = "";
                for (let i = 0; i < event.results.length; ++i) {
                    if (event.results[i].isFinal) finalTranscript += event.results[i][0].transcript;
                    else interim += event.results[i][0].transcript;
                }
                if (vText) vText.innerText = finalTranscript + " " + interim;

                silenceTimer = setTimeout(() => { stopSymptomVoiceRecording(); }, 3000);
            };
            
            speechRec.onend = function() {};
            speechRec.start();
            silenceTimer = setTimeout(() => { stopSymptomVoiceRecording(); }, 3000);
        } else {
            if (vText) vText.innerText = "Speech recognition not supported in this browser. Audio will be saved.";
            silenceTimer = setTimeout(() => stopSymptomVoiceRecording(), 5000);
        }

        mediaRecorder.start();
    }).catch(err => {
        alert("Microphone access denied or error: " + err);
    });
}

function stopSymptomVoiceRecording() {
    clearTimeout(silenceTimer);
    if (mediaRecorder && mediaRecorder.state === "recording") {
        mediaRecorder.stop();
        mediaRecorder.stream.getTracks().forEach(t => t.stop());
    }
    if (speechRec) {
        try { speechRec.stop(); } catch(e){}
    }
    let btn = document.getElementById("micBtn");
    if (btn) {
        btn.innerHTML = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align: middle; margin-top:-2px;"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path><path d="M19 10v2a7 7 0 0 1-14 0v-2"></path><line x1="12" y1="19" x2="12" y2="23"></line><line x1="8" y1="23" x2="16" y2="23"></line></svg>';
        btn.style.background = "";
    }
}


</script>

function tf(key,params){let s=t(key);for(let k in params)s=s.split("{"+k+"}").join(params[k]);return s}
// Triage/escalation reasons and outbreak evidence are stored as English sentences;
// translate them by pattern so old and new reports both display in the chosen language.
function trReason(s){
  const R=[
    [/^(.+) baseline severity: (\w+)$/,m=>tf("rs_base",{d:diseaseLabel(m[1]),l:statusLabel(m[2])})],
    [/^'Healthy' at only ([\d.]+)% with (\d+) symptoms/,m=>tf("rs_healthy",{c:m[1],n:m[2]})],
    [/^Low model confidence \(([\d.]+)%\)/,m=>tf("rs_lowconf",{c:m[1]})],
    [/^Red-flag symptom: (.+)$/,m=>tf("rs_redflag",{s:m[1].split(", ").map(symptomLabel).join(", ")})],
    [/^(\d+) symptoms reported$/,m=>tf("rs_nsym",{n:m[1]})],
    [/^Part of a (\w+) outbreak cluster$/,m=>tf("rs_cluster",{l:statusLabel(m[1])})],
    [/^Disease model did not return a prediction$/,()=>t("rs_nomodel")],
    [/^(\w+) outbreak cluster - district/,m=>tf("es_cluster",{l:statusLabel(m[1])})],
    [/^Suspected anthrax/,()=>t("es_anthrax")],
    [/^Priority disease \((.+)\) with an emerging cluster$/,m=>tf("es_priority",{d:diseaseLabel(m[1])})],
    [/^Handled by the assigned veterinarian$/,()=>t("es_vet")],
    [/^(\d+) unique animals? affected$/,m=>tf("ev_animals",{n:m[1]})],
    [/^(\d+) different farms? affected$/,m=>tf("ev_farms",{n:m[1]})],
    [/^Cases detected within ([\d.]+) km/,m=>tf("ev_within",{k:m[1]})],
    [/^Multiple cases detected within 7 days$/,()=>t("ev_multi")],
    [/^Cases detected across (\d+) villages$/,m=>tf("ev_villages",{n:m[1]})],
    [/^(No cases in previous 28 days|No prior baseline)/,()=>t("ev_new")],
    [/^Recent (?:case )?activity exceeds historical baseline \(([\d.]+)(?: avg)?\/week\)$/,m=>tf("ev_growth",{r:m[1]})],
    [/^Minimum evidence (?:gate )?not met/,()=>t("ev_gate")],
  ];
  for(const [re,f] of R){let m=String(s).match(re);if(m)return f(m)}
  return s;
}
function seasonLabel(x){return x?t("se_"+x,x):"—"}
function vetDistanceText(km){return typeof km==="number"?tf("rp_km",{d:km}):""}

function t(key, fallback) {
  let langMap = I18N[currentLang] || I18N.en;
  return langMap[key] || I18N.en[key] || fallback || key;
}

function validatePhone(phone) {
  let p = String(phone || "").trim().replace(/[\s\-\+]/g, "");
  if (p.startsWith("91") && p.length === 12) p = p.slice(2);
  else if (p.startsWith("0") && p.length === 11) p = p.slice(1);
  if (p.length === 10 && /^[6-9]\d{9}$/.test(p)) {
    return p;
  }
  return null;
}

async function searchVillageLocation(vName, pin, btn) {
  if (!vName) return false;
  let oldText = btn ? btn.innerHTML : "";
  if (btn) btn.innerHTML = t("gps_locating");
  try {
    let q = encodeURIComponent(vName + (pin ? ", " + pin : "") + ", Maharashtra, India");
    let r = await fetch(`https://nominatim.openstreetmap.org/search?q=${q}&format=json&limit=1`);
    let data = await r.json();
    if (!data || !data.length) {
      let q2 = encodeURIComponent(vName + ", India");
      let r2 = await fetch(`https://nominatim.openstreetmap.org/search?q=${q2}&format=json&limit=1`);
      data = await r2.json();
    }
    if (data && data.length > 0) {
      window.userLat = parseFloat(data[0].lat);
      window.locMethod = "village_search";
      window.userLon = parseFloat(data[0].lon);
      if (btn) btn.innerHTML = t("gps_captured");
      return true;
    }
  } catch(e) {}
  if (btn) btn.innerHTML = oldText;
  return false;
}

// ---------------------------------------------------------------
// Location capture. Three interchangeable methods all land here, so
// every account is stored with real coordinates. Those coordinates
// drive nearest-vet assignment, the weather inputs to the disease
// model, and the outbreak engine's 5 km spatial window.
// ---------------------------------------------------------------
window.locMethod = null;

function setLocation(lat, lon, method, addr) {
  window.userLat = lat;
  window.userLon = lon;
  window.locMethod = method;
  addr = addr || {};
  // FORCE fill village and address (overwrite empty fields)
  var f = function(id, val) {
    var el = document.getElementById(id);
    if (el && val) el.value = val;  // Force set, not conditional
  };
  f("svillage", addr.village);
  f("spin", addr.pincode);
  f("saddress", addr.address);
  var d = document.getElementById("sdistrict");
  var s = document.getElementById("sstate");
  if (d && addr.district) d.value = addr.district;
  if (s && addr.state) s.value = addr.state;
  showLatLngIndicator(lat, lon, method, addr);
}

function showLatLngIndicator(lat, lon, method, addr) {
  var box = document.getElementById("locStatus");
  if (!box) return;
  addr = addr || {};
  var label = { gps: t("loc_gps"), map: t("loc_map"), pincode: t("loc_pin") }[method] || "";
  var where = [addr.village, addr.district, addr.state].filter(Boolean).join(", ");
  box.innerHTML =
    '<span style="color:var(--green,#1a7f4b);font-weight:600">✓ ' + esc(t("loc_set")) + '</span>' +
    (label ? ' <span class="muted2">(' + esc(label) + ')</span>' : '') +
    (where ? '<br>' + esc(where) : '') +
    '<br><code style="font-size:12px">' + Number(lat).toFixed(5) + ', ' + Number(lon).toFixed(5) + '</code>';
  box.style.display = "block";
}

async function reverseGeocode(lat, lon) {
  try {
    var r = await fetch("https://nominatim.openstreetmap.org/reverse?lat=" + lat + "&lon=" + lon + "&format=json&addressdetails=1");
    var data = await r.json();
    var a = data.address || {};
    return {
      village: a.village || a.hamlet || a.town || a.suburb || a.city || a.county || "",
      pincode: a.postcode || "",
      district: a.county || a.state_district || "",
      state: a.state || "",
      address: data.display_name ? String(data.display_name).replace(/, India$/, "") : ""
    };
  } catch (e) { return {}; }
}

// Method 1: device GPS
async function useGPS(btn) {
  var old = btn.innerHTML;
  btn.innerHTML = t("gps_locating");
  btn.disabled = true;
  var done = function () { btn.innerHTML = old; btn.disabled = false; };
  if (!navigator.geolocation) { alert(t("loc_gps_fail")); return done(); }
  navigator.geolocation.getCurrentPosition(async function (pos) {
    var addr = await reverseGeocode(pos.coords.latitude, pos.coords.longitude);
    setLocation(pos.coords.latitude, pos.coords.longitude, "gps", addr);
    done();
  }, function () {
    alert(t("loc_gps_fail"));
    done();
  }, { timeout: 10000, enableHighAccuracy: true });
}

// Method 3: pincode -> India Post + Nominatim (server endpoint)
async function usePincode(btn, autoDetect = false) {
  var pinEl = document.getElementById("spin");
  var pin = pinEl ? pinEl.value.trim() : "";
  if (!/^\d{6}$/.test(pin)) { 
    if (!autoDetect) alert(t("loc_pin_need")); 
    return; 
  }
  if (btn) {
    var old = btn.innerHTML;
    btn.innerHTML = t("gps_locating");
    btn.disabled = true;
  }
  try {
    var j = await api("/api/pincode_lookup?pincode=" + encodeURIComponent(pin));
    if (j.latitude == null || j.longitude == null) { 
      if (!autoDetect) alert(t("loc_pin_fail")); 
      return; 
    }
    var places = j.places || [];
    setLocation(j.latitude, j.longitude, "pincode", {
      village: places.length === 1 ? places[0].name : "",
      pincode: pin,
      district: j.district || "",
      state: j.state || ""
    });
    // Several post offices share one pincode -- let the user narrow it down.
    var pick = document.getElementById("locPlacePick");
    if (pick && places.length > 1) {
      pick.classList.remove("hidden");
      pick.innerHTML =
        '<span class="label">' + esc(t("loc_choose_place")) + '</span>' +
        '<select class="field" style="width:100%" onchange="pickPincodePlace(this.value)">' +
        '<option value="">--</option>' +
        places.map(function (p) { return '<option value="' + esc(p.name) + '">' + esc(p.name) + '</option>'; }).join("") +
        '</select>';
    } else if (pick) {
      pick.classList.add("hidden");
      pick.innerHTML = "";
    }
  } catch (e) {
    if (!autoDetect) alert(t("loc_pin_fail"));
  } finally {
    if (btn) {
      btn.innerHTML = old;
      btn.disabled = false;
    }
  }
}

// Auto-trigger pincode detection when 6 digits are entered
function onPincodeInput(e) {
  var pin = e.target.value.trim();
  var statusEl = document.getElementById("pincodeStatus");
  if (/^\d{6}$/.test(pin)) {
    usePincode(null, true); // Auto-detect, no button, no alert
    // Show success message briefly
    if (statusEl) {
      statusEl.style.display = "block";
      setTimeout(function() {
        if (statusEl) statusEl.style.display = "none";
      }, 3000);
    }
  }
}

// Refine a pincode hit to the chosen post-office locality.
async function pickPincodePlace(name) {
  if (!name) return;
  var v = document.getElementById("svillage");
  if (v) v.value = name;
  var pinEl = document.getElementById("spin");
  var pin = pinEl ? pinEl.value.trim() : "";
  try {
    var q = encodeURIComponent(name + ", " + pin + ", India");
    var r = await fetch("https://nominatim.openstreetmap.org/search?q=" + q + "&format=json&limit=1");
    var data = await r.json();
    if (data && data.length) {
      var addr = await reverseGeocode(parseFloat(data[0].lat), parseFloat(data[0].lon));
      addr.village = name;
      setLocation(parseFloat(data[0].lat), parseFloat(data[0].lon), "pincode", addr);
    }
  } catch (e) {}
}

async function signup(){
  let phoneClean = validatePhone(sphone.value);

  if(!spass.value || spass.value.length < 4) return alert(t("err_pass"));
  let r=srole.value;
  
  // Farmer must have village name (either from location or typed manually)
  if (r === "farmer" && (!svillage || !svillage.value.trim())) {
    return alert("Village name is required. Use GPS/Map to detect it, or enter it manually.");
  }
  
  // Last resort before blocking: geocode the typed village name.
  if (window.userLat == null && svillage && svillage.value.trim()) {
    await searchVillageLocation(svillage.value.trim(), spin.value.trim(), null);
  }
  // Coordinates are mandatory: nearest-vet routing, the weather inputs to
  // the disease model and the outbreak spatial window all depend on them.
  if (window.userLat == null || window.userLon == null) return alert(t("loc_need"));

  let sd=document.getElementById("sdistrict"), ss=document.getElementById("sstate");
  let d={
      name:sname.value, phone:phoneClean, password:spass.value, role:r, pincode:spin.value,
      latitude: window.userLat,

      location_method: window.locMethod || "village_search",

// Normalised index: lowercase, collapse spaces/punctuation, and fold the
// Diarrhea/Diarrhoea spelling split.
var _SYM_NORM = (function(){
  var m = {};
  function norm(x){
    return String(x||"").toLowerCase()
      .replace(/diarrhoea/g,"diarrhea")
      .replace(/[^a-z]+/g," ").trim();
  }
  for (var k in SYMPTOM_LABELS) m[norm(k)] = SYMPTOM_LABELS[k];
  m._norm = norm;
  return m;
})();

function symptomLabel(s) {
  var e = SYMPTOM_LABELS[s] || _SYM_NORM[_SYM_NORM._norm(s)];
  if (!e) return s;
  if (currentLang === "hi" && e.hi) return e.hi;
  if (currentLang === "mr" && e.mr) return e.mr;
  return s;
}

function diseaseLabel(d) {
  if (!d) return "—";
  // Matches the current model's class names and the old underscore names still
  // stored in earlier reports.
  let k = d.replace(/_/g, " ");
  if (k.includes("Foot and Mouth") || k.includes("FMD")) return t("d_fmd", d);
  if (k.includes("Lumpy Skin")) return t("d_lsd", d);
  if (k.includes("Hemorrhagic Septicemia")) return t("d_hs", d);
  if (k.includes("Black Quarter")) return t("d_bq", d);
  if (k.includes("Mastitis")) return t("d_mastitis", d);
  if (k.includes("Anthrax")) return t("d_anthrax", d);
  if (k.includes("Healthy")) return t("d_healthy", d);
  return d;
}

function statusLabel(s) {
  if (!s) return "—";
  return t("t_" + s.toLowerCase(), s);
}

function symptomGrid(selected=[]){
  return `<div class="symgrid">${SYMPTOMS.map(s=>`<label class="sym"><input class="symcheck" type="checkbox" value="${esc(s)}" ${selected.includes(s)?"checked":""}> ${esc(symptomLabel(s))}</label>`).join("")}</div>`;
}

async function submitReport(aid){
  let symptoms=[...document.querySelectorAll(".symcheck:checked")].map(x=>x.value);
  if(!symptoms.length)return alert(t("select_symptom"));
  if(!reportAge.value.trim())return alert(t("err_age_required"));
  let reportInputs={
    age_months:Number(reportAge.value),
    herd_size:Number(reportHerdSize.value||1),
    dist_waterbody_km:Number(reportWaterbody.value||1.2),
    vaccinated_fmd_date:reportVaccFmd.value,
    vaccinated_hs_date:reportVaccHs.value,
    vaccinated_lsd_date:reportVaccLsd.value,
    vaccinated_bq_date:reportVaccBq.value
  };
  if(window._reportBusy)return;
  window._reportBusy=true;
  let btn=[...modalBody.querySelectorAll("button")].find(b=>/Save report|सहेजें|जतन/i.test(b.textContent));
  if(btn){btn.disabled=true;btn.textContent=t("running_model");}

  

  try{
    let j=await api("/api/cases/report",{method:"POST",body:JSON.stringify({animal_id:aid,symptoms,notes:reportNotes.value,latitude:window.reportLat,longitude:window.reportLon,audio_base64:window._lastAudioBase64,...reportInputs})});
    showPredictionResult(j);
  }catch(e){
    window._reportBusy=false;
    if(btn){btn.disabled=false;btn.textContent=t("save_report");}
    alert(e.message);
  }
}
const TRIAGE_COLOR={Low:"#2e9d5b",Moderate:"#f1c40f",High:"#e67e22",Critical:"#e02020",Unknown:"#888"};
const OB_COLOR={LOW:"#2e9d5b",MODERATE:"#f1c40f",HIGH:"#e67e22",CRITICAL:"#e02020",UNKNOWN:"#888"};
function pct(v){return typeof v==="number"?Math.round(v*100)+"%":"—"}
function kv(k,v){return `<div style="display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px solid var(--line)"><span class="muted">${esc(k)}</span><b style="text-align:right">${v}</b></div>`}
function bar(label,frac,color){let w=Math.max(0,Math.min(100,Math.round((frac||0)*100)));
  return `<div style="margin:7px 0"><div style="display:flex;justify-content:space-between;font-size:13px"><span>${esc(label)}</span><b>${w}%</b></div><div style="height:7px;background:var(--line);border-radius:4px;overflow:hidden"><div style="height:100%;width:${w}%;background:${color||"var(--green,#1d6b4f)"}"></div></div></div>`}

// Model disease, triage, outbreak and escalation in one place, with every value
// that went into them. The model only predicts disease + confidence; the other
// three are rule-based and their reasons are shown alongside.
function obScore(p){if(typeof p?.outbreak_risk_score==="number")return p.outbreak_risk_score;if(typeof p?.outbreak_probability==="number")return Math.round(p.outbreak_probability*100);return null}
function obScoreText(p){let s=obScore(p);return s==null?"—":s+"/100"}

// ---- Advisories (text in static/advisories.js; notifications store only which advisory applies) ----
function advLang(){return I18N[currentLang]&&window.GV_ADVISORIES?.farmer?.[currentLang]?currentLang:"en"}
function advList(p){return `<ul style="margin:8px 0 0;padding-left:20px">${p.map(x=>`<li style="margin:3px 0">${esc(x)}</li>`).join("")}</ul>`}
function advPill(level){let c=TRIAGE_COLOR[level]||OB_COLOR[level]||"#888";return `<span class="pill" style="background:${c};color:#fff">${esc(statusLabel(level))}</span>`}
function advisoryTitle(d){
  let A=window.GV_ADVISORIES; if(!A||!d) return "";
  let F=A.farmer[advLang()];
  if(d.adv==="farmer_disease") return (d.disease==="Healthy"?F.healthy:F.disease[d.disease]?.[d.level])?.t||"";
  if(d.adv==="farmer_outbreak") return F.outbreak[d.disease]?.[d.level]?.t||"";
  if(d.adv==="vet_confirmed"||(d.adv==="vet_outbreak"&&d.confirmed)) return A.vet.confirmed[d.disease]?.t+" — "+(d.village||"");
  if(d.adv==="vet_outbreak") return `Suspected ${d.disease} — ${d.village||""}`;
  return "";
}
function advisoryHTML(d){
  let A=window.GV_ADVISORIES; if(!A||!d) return "";
  let F=A.farmer[advLang()], U=F.ui, V=A.vet;
  let box=(cls,txt)=>`<div class="notice ${cls}" style="margin-top:10px">${txt}</div>`;
  let anthrax=d.disease==="Anthrax";
  if(d.adv==="farmer_disease"){
    let a=d.disease==="Healthy"?F.healthy:F.disease[d.disease]?.[d.level]; if(!a) return "";
    return `<div class="eyebrow">${esc(U.health_adv)}${d.animal?` · ${esc(U.animal)}: ${esc(d.animal)}`:""}</div>
      <h3 style="margin:4px 0">${esc(a.t)} ${d.level?advPill(d.level):""}</h3>
      <p style="margin:6px 0 0">${esc(a.i)}</p>${advList(a.p)}
      ${a.note?box("amber",esc(a.note)):""}${anthrax?box("red","<b>⚠️ "+esc(U.anthrax)+"</b>"):""}
      ${box("blue","<b>"+esc(U.disclaimer)+"</b>")}<div class="muted2" style="margin-top:6px">${esc(U.source)}</div>`;
  }
  if(d.adv==="farmer_outbreak"){
    let a=F.outbreak[d.disease]?.[d.level]; if(!a) return "";
    return `<div class="eyebrow">${esc(U.outbreak_adv)} · ${esc(U.village)}: ${esc(d.village||"—")}</div>
      <h3 style="margin:4px 0">${esc(a.t)} ${advPill(d.level)}</h3>
      <div class="muted" style="margin-top:4px">${d.confirmed?"✅ "+esc(U.confirmed):"🛰️ "+esc(U.suspected)}</div>
      ${a.i?`<p style="margin:6px 0 0">${esc(a.i)}</p>`:""}${advList(a.p)}
      ${anthrax?box("red","<b>⚠️ "+esc(U.anthrax)+"</b>"):""}${box("blue","<b>"+esc(U.outbreak_disc)+"</b>")}
      <div class="muted2" style="margin-top:6px">${esc(U.source)}</div>`;
  }
  if(d.adv==="vet_confirmed"||(d.adv==="vet_outbreak"&&d.confirmed)){
    let C=V.confirmed[d.disease]; if(!C) return "";
    return `<div class="eyebrow">✅ ${esc(V.ui.confirmed_by)}${d.confirmed_by?": "+esc(d.confirmed_by):""} · ${esc(d.village||"")}</div>
      <h3 style="margin:4px 0">${esc(C.t)} ${advPill("CRITICAL")}</h3>
      ${C.sections.map(x=>`<div style="margin-top:10px"><b>${esc(x.h)}</b>${advList(x.p)}</div>`).join("")}
      <div class="muted2" style="margin-top:8px"><b>${esc(V.ui.evidence)}:</b> ${esc(C.evidence)} ${esc(V.ui.no_numbers)}</div>
      ${box("blue",esc(V.ui.levels_note)+" "+esc(V.ui.outbreak_disc))}
      <div class="muted2" style="margin-top:6px"><b>${esc(V.ui.sources)}:</b> ${V.refs.map(r=>`<a href="${esc(r.u)}" target="_blank" rel="noopener">${esc(r.t)}</a>`).join(" · ")}</div>`;
  }
  if(d.adv==="vet_outbreak"){
    return `<div class="eyebrow">⚠️ ${esc(d.village||"")} · ${d.score??"—"}/100</div>
      <h3 style="margin:4px 0">Suspected ${esc(d.disease)} ${advPill(d.level)}</h3>
      ${box("amber","<b>"+esc(V.ui.suspected.replace("{d}",d.disease))+"</b>")}
      <div style="margin-top:10px"><b>${esc(V.ui.level_action)}:</b> ${esc(V.matrix[d.level]||"")}</div>
      <div class="muted2" style="margin-top:6px">${esc(V.ui.animals)}: ${d.animals??"—"} · ${esc(V.ui.farms)}: ${d.farms??"—"}${d.cluster_animals!=null?` (5 km cluster: ${d.cluster_animals} animals, ${d.cluster_farms} farms)`:""}</div>
      <div style="margin-top:8px">${esc(V.ui.how_confirm)}</div>
      ${box("blue",esc(V.ui.levels_note)+" "+esc(V.ui.outbreak_disc))}`;
  }
  return "";
}
// Popup queue: unread advisories are shown one by one before anything else.
window._advShown=window._advShown||new Set();
function showAdvisoryPopups(list,onDone){
  let U=window.GV_ADVISORIES?.farmer?.[advLang()]?.ui||{};
  let i=0;
  let step=async()=>{
    if(i>=list.length){ if(onDone) onDone(); else closeModal(); return; }
    let n=list[i]; window._advShown.add(n.id);
    let last=i===list.length-1;
    modalBody.innerHTML=`<div class="eyebrow" style="color:#e02020">🔔 ${esc(U.popup||"Important advisory")}${list.length>1?` · ${esc((U.of||"{i} of {n}").replace("{i}",i+1).replace("{n}",list.length))}`:""}</div>
      <div style="margin-top:6px">${advisoryHTML(n.data)}</div>
      <div style="margin-top:14px;display:flex;gap:9px"><button class="btn" id="advNext">${esc(last?(onDone?U.see_report:U.got_it):U.next)||"OK"}</button></div>`;
    modal.classList.remove("hidden");
    document.getElementById("advNext").onclick=async()=>{
      try{await api("/api/notifications/read",{method:"POST",body:JSON.stringify({id:n.id})})}catch{}
      i++; step();
    };
  };
  step();
}
const SEV_RANK={CRITICAL:3,HIGH:2,INFO:1};
function pendingAdvisories(notifs){
  return notifs.filter(n=>!n.read_at&&n.data&&n.data.adv&&advisoryHTML(n.data)&&!window._advShown.has(n.id))
    .sort((a,b)=>(SEV_RANK[b.severity]||0)-(SEV_RANK[a.severity]||0)||b.id-a.id);
}

      <div class="grid two" style="margin-top:8px">
      <div>${kv(t("as_score"),"0.35×"+o.spatial_score+" + 0.30×"+o.temporal_score+" + 0.20×"+o.growth_score+" + 0.15×"+o.farm_spread_score)}${(o.villages||[]).map(v=>kv(v.village,tf("as_n_animals",{n:v.unique_animals})+", "+tf("as_n_farms",{n:v.unique_farms}))).join("")}</div>
      <div>${kv(t("as_ob_score"),`<span style="color:${OB_COLOR[o.outbreak_status]}">${o.outbreak_risk_score}/100 · ${esc(statusLabel(o.outbreak_status))}</span>`)}<div style="margin-top:8px">${(o.evidence||[]).map(e=>`<div class="muted2">• ${esc(trReason(e))}</div>`).join("")}</div></div></div>`;

function playSiren() {
    try {
        let ctx = new (window.AudioContext || window.webkitAudioContext)();
        let osc = ctx.createOscillator();
        let gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.type = 'square';
        let now = ctx.currentTime;
        let t = now;
        for(let i=0; i<3; i++) {
            osc.frequency.setValueAtTime(900, t);
            t += 0.5;
            osc.frequency.setValueAtTime(700, t);
            t += 0.5;
        }
        gain.gain.setValueAtTime(0.1, now);
        gain.gain.linearRampToValueAtTime(0.1, now + 2.5);
        gain.gain.linearRampToValueAtTime(0, now + 3.0);
        osc.start(now);
        osc.stop(now + 3.0);
    } catch(e) {}
}

async function govVaxSubmit(){
  if(govVax.busy)return;
  let d=govVax.md,vet=Number(gvxVet.value),vac=gvxVac.value,raw=gvxQty.value.trim(),qty=Number(raw);
  let avail=(d.central.find(x=>x.vaccine===vac)||{}).quantity;
  let err=!vet?"Choose a veterinarian.":!vac?"Choose a vaccine.":!/^\d+$/.test(raw)||qty<1?"Enter a whole number of doses (at least 1).":qty>avail?`Government stock is ${avail} ${vac}; you cannot release ${qty}.`:"";
  if(err){gvxErr.textContent=err;gvxErr.style.display="block";return}
  govVax.busy=true;gvxBtn.disabled=true;gvxBtn.textContent="Releasing…";
  try{
    let j=await api("/api/govt/vaccine-shipments",{method:"POST",body:JSON.stringify({vet_id:vet,vaccine:vac,quantity:qty,idempotency_key:govVax.key})});
    let s=j.shipment;
    govVax.msg=j.duplicate?`This release was already submitted — shipment #${s.id} (${s.quantity} ${s.vaccine} to ${s.vet_name}) is ${s.status}.`:`Released ${s.quantity} ${s.vaccine} to ${s.vet_name}. Shipment #${s.id} is ${s.status} until the veterinarian confirms receipt.`;
    closeModal();
    await loadGovVaccineInventory();
  }catch(e){
    gvxErr.textContent=e.message;gvxErr.style.display="block";
    try{govVax.md=await api("/api/govt/vaccine-inventory");gvxVac.innerHTML=govVaxVacOpts(gvxVac.value);govVaxInfo()}catch(_){}   // show the stock as it really is now
  }finally{govVax.busy=false;if(window.gvxBtn){gvxBtn.disabled=false;gvxBtn.textContent="Release vaccine"}}
}

const vetVax={seq:0,data:null,busy:new Set(),msg:"",err:"",seen:undefined};
function vetVaxRender(){
  let box=document.getElementById("vetVaccineInv"),d=vetVax.data;if(!box||!d)return;
  let low=d.stock.filter(s=>s.low),incoming=d.shipments.filter(s=>s.status==="IN_TRANSIT");
  let html=(vetVax.msg?`<div class="notice blue" style="margin-top:18px">${esc(vetVax.msg)}</div>`:"")+(vetVax.err?`<div class="notice red" style="margin-top:18px">${esc(vetVax.err)}</div>`:"");
  html+=govVaxCard("Vaccine inventory",
    (low.length?`<div class="notice red" style="margin-bottom:6px">⚠ Low stock: ${low.map(s=>`${esc(s.vaccine)} (${s.quantity})`).join(", ")}. Fewer than ${d.threshold} left.</div>`:`<p class="muted" style="margin:0 0 6px">Your current stock for each vaccine.</p>`)+
    d.stock.map(s=>`<div class="animal-line"><div style="flex:1"><b>${esc(s.vaccine)} vaccine</b><div class="muted">${s.low?`Fewer than ${d.threshold} left`:"In stock"}</div></div>${s.low?`<span class="pill bad">⚠ ${s.quantity<=0?"Out of stock":"Low stock"}</span>&nbsp;`:""}<span class="pill ${s.low?"bad":""}">${s.quantity} doses</span></div>`).join(""),
    `<button class="btn secondary" onclick="vetVax.msg=vetVax.err='';loadVetVaccineInventory()">Refresh</button>`);
  html+=govVaxCard("Incoming vaccines",
    `<p class="muted" style="margin:0 0 6px">Released by the government and on the way. Your stock increases only after you confirm they have arrived.</p><div class="tablewrap"><table><thead><tr><th>Vaccine</th><th>Quantity</th><th>Released by</th><th>Release time</th><th></th></tr></thead><tbody>${incoming.map(s=>{let b=vetVax.busy.has(s.id);return `<tr><td><b>${esc(s.vaccine)}</b><div class="muted2">Shipment #${s.id}</div></td><td>${s.quantity}</td><td>${esc(s.released_by_name||"Government")}</td><td>${govVaxTime(s.released_at)}</td><td><button class="btn" ${b?"disabled":""} onclick="vetVaxReceive(${s.id})">${b?"Confirming…":"Confirm Received"}</button></td></tr>`}).join("")||"<tr><td colspan='5'>No vaccines on the way.</td></tr>"}</tbody></table></div>`);
  box.innerHTML=html;
}
async function loadVetVaccineInventory(silent){
  let box=document.getElementById("vetVaccineInv");if(!box)return;
  let my=++vetVax.seq;
  if(!silent&&!vetVax.data)box.innerHTML=govVaxCard("Vaccine inventory",`<p class="muted">Loading vaccine inventory…</p>`);
  let d;
  try{d=await api("/api/vet/vaccine-inventory")}
  catch(e){
    box=document.getElementById("vetVaccineInv");if(!box||my!==vetVax.seq)return;
    if(silent&&vetVax.data)return;   // background refresh failed: keep showing what we have
    vetVax.data=null;
    box.innerHTML=(vetVax.msg?`<div class="notice blue" style="margin-top:18px">${esc(vetVax.msg)}</div>`:"")+govVaxCard("Vaccine inventory &amp; incoming vaccines",`<div class="notice red">Could not load vaccine inventory: ${esc(e.message)}</div>`,`<button class="btn secondary" onclick="vetVax.msg=vetVax.err='';loadVetVaccineInventory()">Retry</button>`);
    return;
  }
  if(!document.getElementById("vetVaccineInv")||my!==vetVax.seq)return;   // navigated away, or a newer load is in flight
  if(silent&&vetVax.data&&JSON.stringify(vetVax.data)===JSON.stringify(d))return;   // nothing changed
  vetVax.data=d;vetVaxRender();vetVaxSyncStat();
}
async function vetVaxSyncStat(){   // keep the existing "Resources" stat card consistent with the inventory above
  try{let j=await api("/api/vet/overview");if(window.vetResLeft){vetResLeft.textContent=j.resources_left;vetResSent.textContent=`of ${j.resources_sent} total`}}catch(_){}
}
async function vetVaxReceive(id){
  if(vetVax.busy.has(id))return;   // already confirming this shipment
  vetVax.busy.add(id);vetVax.msg="";vetVax.err="";vetVaxRender();
  try{
    let j=await api(`/api/vet/vaccine-shipments/${id}/receive`,{method:"POST"});   // 1) backend first
    vetVax.msg=`Received ${j.quantity} ${j.vaccine} (shipment #${j.shipment_id}). Your ${j.vaccine} stock is now ${j.new_stock}.`;
  }catch(e){vetVax.err=`Could not confirm shipment #${id}: ${e.message}`}
  try{await loadVetVaccineInventory()}   // 2) then re-read inventory + shipment status from the backend
  finally{vetVax.busy.delete(id);vetVaxRender()}
}
function vetVaxNotifSync(list){   // called from the existing notification poll: a new SHIPMENT / LOW_STOCK notification means our numbers may have changed
  if(!document.getElementById("vetVaccineInv"))return;
  let ids=list.filter(n=>n.kind==="SHIPMENT"||n.kind==="LOW_STOCK").map(n=>n.id),top=ids.length?Math.max(...ids):0;
  if(top!==vetVax.seen){vetVax.seen=top;loadVetVaccineInventory(true)}
}
async function boot(){
  setLanguage(currentLang);
  try{
    let m=await api("/api/me");
    if(m.authenticated){
      gramvetState.currentUser = m.user;
      openApp();
    }else authMode("login");
  }catch(e){authMode("login");}
}
boot();
setInterval(refreshNotifications,20000);

// Offline-first sync: push queued changes to MongoDB when net available
var gramvetSyncPending=0;
async function gramvetSync(){
  if(!navigator.onLine) return;
  try{
    let r=await api("/api/sync");
    if(r.synced>0 || r.pending>0) console.log(`[GramVet Sync] ${r.synced} synced, ${r.pending} still pending`);
    gramvetSyncPending=r.pending||0;
  }catch(e){console.warn("[GramVet Sync] error:",e.message);}
}
window.addEventListener('online', gramvetSync);  // Sync immediately when net returns
setInterval(gramvetSync, 30000);  // Also sync every 30s if online
if(navigator.onLine) gramvetSync();  // Sync on page load if online

let mediaRecorder = null;
let audioChunks = [];
let speechRec = null;
let silenceTimer = null;
let finalTranscript = "";

function startSymptomVoiceRecording(btn) {
    if (mediaRecorder && mediaRecorder.state === "recording") {
        stopSymptomVoiceRecording();
        return;
    }
    
    let lang = document.getElementById("langApp").value || "en";
    let speechLang = "en-IN";
    if (lang === "hi") speechLang = "hi-IN";
    if (lang === "mr") speechLang = "mr-IN";

    navigator.mediaDevices.getUserMedia({ audio: true }).then(stream => {
        mediaRecorder = new MediaRecorder(stream);
        audioChunks = [];
        mediaRecorder.ondataavailable = e => { if (e.data.size > 0) audioChunks.push(e.data); };
        mediaRecorder.onstop = () => {
            let blob = new Blob(audioChunks, { type: "audio/webm" });
            let reader = new FileReader();
            reader.readAsDataURL(blob);
            reader.onloadend = () => {
                window._lastAudioBase64 = reader.result;
                document.getElementById("voiceStatus").innerText = "Audio recorded! Matching symptoms...";
                matchSymptomsFromTranscript(finalTranscript);
            }
        };

        let vStatus = document.getElementById("voiceStatus");
        let vText = document.getElementById("voiceTranscript");
        if (vStatus) { vStatus.style.display = "block"; vStatus.innerText = "Listening... Speak your symptoms."; }
        if (vText) { vText.style.display = "block"; vText.innerText = ""; }
        finalTranscript = "";
        
        btn.innerHTML = '<svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align: middle; margin-top:-2px;"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect></svg>'; // red stop or something
        btn.style.background = "var(--red)";

        let SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (SpeechRecognition) {
            speechRec = new SpeechRecognition();
            speechRec.continuous = true;
            speechRec.interimResults = true;
            speechRec.lang = speechLang;

            speechRec.onresult = function(event) {
                clearTimeout(silenceTimer);
                
                let interim = "";
                finalTranscript = "";
                for (let i = 0; i < event.results.length; ++i) {
                    if (event.results[i].isFinal) finalTranscript += event.results[i][0].transcript;
                    else interim += event.results[i][0].transcript;
                }
                if (vText) vText.innerText = finalTranscript + " " + interim;

                silenceTimer = setTimeout(() => { stopSymptomVoiceRecording(); }, 3000);
            };
            
            speechRec.onend = function() {};
            speechRec.start();
            silenceTimer = setTimeout(() => { stopSymptomVoiceRecording(); }, 3000);
        } else {
            if (vText) vText.innerText = "Speech recognition not supported in this browser. Audio will be saved.";
            silenceTimer = setTimeout(() => stopSymptomVoiceRecording(), 5000);
        }

        mediaRecorder.start();
    }).catch(err => {
        alert("Microphone access denied or error: " + err);
    });
}

function stopSymptomVoiceRecording() {
    clearTimeout(silenceTimer);
    if (mediaRecorder && mediaRecorder.state === "recording") {
        mediaRecorder.stop();
        mediaRecorder.stream.getTracks().forEach(t => t.stop());
    }
    if (speechRec) {
        try { speechRec.stop(); } catch(e){}
    }
    let btn = document.getElementById("micBtn");
    if (btn) {
        btn.innerHTML = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align: middle; margin-top:-2px;"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path><path d="M19 10v2a7 7 0 0 1-14 0v-2"></path><line x1="12" y1="19" x2="12" y2="23"></line><line x1="8" y1="23" x2="16" y2="23"></line></svg>';
        btn.style.background = "";
    }
}


async function matchSymptomsFromTranscript(text) {
    let vStatus = document.getElementById("voiceStatus");
    if (vStatus) vStatus.innerText = "Processing text with AI / Extractor...";
    
    try {
        let resp = await api("/api/extract_symptoms", {
            method: "POST",
            body: JSON.stringify({text: text})
        });
        
        let matched = resp.symptoms || [];
        
        let checkboxes = document.querySelectorAll(".symcheck");
        checkboxes.forEach(cb => {
            if (matched.includes(cb.value)) {
                cb.checked = true;
            }
        });

        if (vStatus) {
            vStatus.innerText = matched.length > 0 ? ("Extracted: " + matched.join(", ")) : "No exact symptoms matched from description. Audio saved.";
        }
    } catch(e) {
        console.error("Extraction error", e);
        if (vStatus) vStatus.innerText = "Error extracting symptoms. Audio saved.";
    }
}


let locMap = null;

// Map picker in the food-delivery style: the pin is fixed to the centre
// of the viewport and the map pans underneath it, so confirming just
// reads map.getCenter(). Easier on a phone than tapping an exact point.
function openMapModal(btn) {
  let mapDiv = document.getElementById("locationMapModal");
  if (!mapDiv) {
    mapDiv = document.createElement("div");
    mapDiv.id = "locationMapModal";
    mapDiv.style.cssText = "position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:9999;display:flex;align-items:center;justify-content:center;padding:12px;";
    mapDiv.innerHTML = `
      <div style="background:var(--bg,#fff);padding:16px;border-radius:14px;width:100%;max-width:520px;display:flex;flex-direction:column;gap:10px;">
        <h3 style="margin:0">${t("loc_map")}</h3>
        <div style="display:flex;gap:6px">
          <input id="mapSearch" class="field" style="flex:1" placeholder="${t("map_search_ph")}"
                 onkeydown="if(event.key==='Enter'){event.preventDefault();mapSearch_go();}">
          <button type="button" class="btn secondary" onclick="mapSearch_go()">&#128269;</button>
        </div>
        <div style="position:relative">
          <div id="locMap" style="height:320px;border-radius:10px"></div>
          <div style="position:absolute;left:50%;top:50%;transform:translate(-50%,-100%);font-size:34px;line-height:1;pointer-events:none;z-index:500;text-shadow:0 2px 4px rgba(0,0,0,.4)">&#128205;</div>
        </div>
        <div class="muted2" style="font-size:12px">${t("map_hint")}</div>
        <div id="mapCoords" class="muted2" style="font-size:12px"></div>
        <div style="display:flex;gap:8px;justify-content:space-between;flex-wrap:wrap">
          <button type="button" class="btn secondary" onclick="mapUseGPS()">${t("map_locate")}</button>
          <span style="display:flex;gap:8px">
            <button type="button" class="btn secondary" onclick="closeMapModal()">${t("map_cancel")}</button>
            <button type="button" class="btn" onclick="confirmPinpoint()">${t("map_confirm")}</button>
          </span>
        </div>
      </div>`;
    document.body.appendChild(mapDiv);
  }
  mapDiv.style.display = "flex";

  setTimeout(function () {
    if (!locMap) {
      locMap = L.map("locMap", { zoomControl: true }).setView([19.7515, 75.7139], 6);
      L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", { maxZoom: 19 }).addTo(locMap);
      locMap.on("move", function () {
        var ctr = locMap.getCenter();
        var el = document.getElementById("mapCoords");
        if (el) el.textContent = ctr.lat.toFixed(5) + ", " + ctr.lng.toFixed(5);
      });
    } else {
      locMap.invalidateSize();
    }
    // Open on the best position we already know about.
    if (window.userLat != null && window.userLon != null) {
      locMap.setView([window.userLat, window.userLon], 15);
    } else {
      mapUseGPS(true);
    }
    locMap.fire("move");
  }, 120);
}

function closeMapModal() {
  var m = document.getElementById("locationMapModal");
  if (m) m.style.display = "none";
}

function mapUseGPS(silent) {
  if (!navigator.geolocation) { if (!silent) alert(t("loc_gps_fail")); return; }
  navigator.geolocation.getCurrentPosition(function (pos) {
    if (locMap) locMap.setView([pos.coords.latitude, pos.coords.longitude], 16);
  }, function () { if (!silent) alert(t("loc_gps_fail")); }, { timeout: 8000 });
}

async function mapSearch_go() {
  var el = document.getElementById("mapSearch");
  var q = el ? el.value.trim() : "";
  if (!q || !locMap) return;
  try {
    var r = await fetch("https://nominatim.openstreetmap.org/search?q=" + encodeURIComponent(q + ", India") + "&format=json&limit=1");
    var data = await r.json();
    if (data && data.length) locMap.setView([parseFloat(data[0].lat), parseFloat(data[0].lon)], 15);
    else alert(t("loc_pin_fail"));
  } catch (e) {}
}

async function confirmPinpoint() {
  if (!locMap) return;
  var ctr = locMap.getCenter();
  closeMapModal();
  var addr = await reverseGeocode(ctr.lat, ctr.lng);
  setLocation(ctr.lat, ctr.lng, "map", addr);
}
